name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between an in-progress
# run and the latest one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build (includes typecheck)
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-droplet:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy over rsync
        env:
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          HOST: ${{ secrets.DROPLET_HOST }}
          USER: ${{ secrets.DROPLET_USER }}
        run: |
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key

          # Pin the droplet's actual host key (public info, not a secret) instead of
          # trusting it blind on first connect.
          cat >> ~/.ssh/known_hosts <<'EOF'
          64.225.24.213 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILlk3D7CJQUcDAP8Mb6lPujocWrZeGSneg9CZen7/WV+
          64.225.24.213 ssh-rsa 
          64.225.24.213 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBPWFj7eFDUluDsKdnJBr3f7KUrEgeIbEMwrcocbHBL8v79dZq16iQDwqQpwruGf/rCgyaEwMtJTm7VqgVfdeRBg=
          EOF

          # The deploy key is forced (via authorized_keys) into rrsync, restricted to
          # a single directory on the droplet — it can only sync files there, nothing
          # else. The destination must be given relative to that restricted root
          # (rrsync chdir's into it server-side); "./" IS that root.
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" dist/ "$USER@$HOST:./"
