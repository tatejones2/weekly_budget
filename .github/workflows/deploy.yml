name: Build, test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: weekly
          POSTGRES_PASSWORD: weekly_ci
          POSTGRES_DB: weekly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U weekly"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://weekly:weekly_ci@localhost:5432/weekly_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run db:migrate

      - name: Test
        run: npm test

      - name: Build (includes typecheck, client + server)
        run: npm run build

  build-and-push:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/tatejones2/weekly_budget:latest
            ghcr.io/tatejones2/weekly_budget:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Pull and restart on the droplet
        env:
          SSH_KEY: ${{ secrets.DROPLET_DEPLOY_KEY }}
          HOST: ${{ secrets.DROPLET_HOST }}
          USER: ${{ secrets.DROPLET_USER }}
        run: |
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key

          # Pin the droplet's actual host key (public info, not a secret)
          # instead of trusting it blind on first connect.
          cat >> ~/.ssh/known_hosts <<'EOF'
          64.225.24.213 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILlk3D7CJQUcDAP8Mb6lPujocWrZeGSneg9CZen7/WV+
          64.225.24.213 ssh-rsa 
          64.225.24.213 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBPWFj7eFDUluDsKdnJBr3f7KUrEgeIbEMwrcocbHBL8v79dZq16iQDwqQpwruGf/rCgyaEwMtJTm7VqgVfdeRBg=
          EOF

          # The deploy key's authorized_keys entry forces one exact command
          # (pull + restart the weekly-budget container) — no shell, no other
          # command possible, same least-privilege posture as the rsync key
          # it replaces.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$USER@$HOST"
